when:
  - event: [push, pull_request]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      depth: 0

steps:
  - name: validate-image-contract
    image: python:3.12-alpine
    commands:
      - python -m unittest scripts.tests.test_docker_image_contract

  - name: build-inspircd
    image: woodpeckerci/plugin-docker-buildx
    when:
      - event: push
        branch: [main, relayos]
    settings:
      repo: ghcr.io/relayos/inspircd
      dockerfile: docker/Dockerfile
      context: .
      platforms: linux/amd64
      tag: [latest, "${CI_COMMIT_SHA}"]
      logins:
        - registry: ghcr.io
          username:
            from_secret: ghcr_username
          password:
            from_secret: ghcr_token
